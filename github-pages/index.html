    <meta charset="UTF-8" />

      name="description"
      content="Ателье Анны — уютная игра-тамагочи про швею с механикой три в ряд."
    />

    <meta name="application-name" content="Ателье Анны" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ателье Анны" />

    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <title>Ателье Анны — v1.0.0</title>
    <style>
      html,body{min-width:320px;min-height:100%;margin:0;background:#efe4d4;color:#4e3835;font-family:"Trebuchet MS",Arial,sans-serif}
      .boot-loader{display:grid;min-height:100dvh;place-items:center;align-content:center;gap:10px;text-align:center;background:radial-gradient(circle at 8% 0%,rgba(255,255,255,.84),transparent 28%),linear-gradient(135deg,#efe4d4 0%,#f7eee2 48%,#ead9c5 100%)}
      .boot-mark{display:grid;width:74px;height:74px;margin-bottom:4px;place-items:center;border:1px solid rgba(183,95,101,.34);border-radius:50% 50% 44% 56%;color:#fff8ed;background:linear-gradient(145deg,#c87175,#9e4e57);box-shadow:inset 0 0 0 6px rgba(255,255,255,.16),0 10px 30px rgba(143,68,76,.2);font:italic 700 40px/1 Georgia,serif;transform:rotate(-4deg)}
      .boot-loader strong{font:600 30px/1.1 Georgia,serif}.boot-loader span{color:#887a76;font-size:11px}.boot-loader i{overflow:hidden;width:150px;height:5px;margin-top:5px;border-radius:999px;background:rgba(99,72,59,.12)}.boot-loader i::after{display:block;width:48%;height:100%;border-radius:inherit;content:"";background:linear-gradient(90deg,#b75f65,#dda84b);animation:boot-progress 900ms ease-in-out infinite alternate}@keyframes boot-progress{from{transform:translateX(-54px)}to{transform:translateX(80px)}}
    </style>
  </head>
  <body>
    <div id="root"><main class="boot-loader" role="status" aria-live="polite"><div class="boot-mark" aria-hidden="true">А</div><strong>Ателье Анны</strong><span>Загружаем мастерскую…</span><i aria-hidden="true"></i></main></div>
    <script type="module" src="./main.tsx"></script>
  </body>
