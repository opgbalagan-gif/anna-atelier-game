    <style>
      *{box-sizing:border-box}html,body,#root{min-width:320px;min-height:100%;margin:0;background:#3a2116;color:#fff7e9;font-family:"Trebuchet MS",Arial,sans-serif}.splash-screen{position:fixed;z-index:10000;inset:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background-color:#3a2116;background-image:linear-gradient(to bottom,transparent 54%,rgba(39,20,13,.12) 72%,rgba(39,20,13,.72) 100%),url("/assets/loading/atelier-anna-splash.png");background-position:center;background-repeat:no-repeat;background-size:cover}.splash-loading-card{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px));left:max(22px,env(safe-area-inset-left));display:grid;width:min(330px,calc(100% - 44px));margin:0 auto;padding:15px 18px 13px;border:1px solid rgba(255,238,211,.32);border-radius:18px;background:rgba(65,35,25,.64);box-shadow:0 12px 34px rgba(29,13,8,.24),inset 0 1px rgba(255,248,232,.12);text-align:center;-webkit-backdrop-filter:blur(8px) saturate(.92);backdrop-filter:blur(8px) saturate(.92)}.splash-loading-card strong{font:italic 600 17px/1.2 Georgia,serif;letter-spacing:.01em;text-shadow:0 1px 8px rgba(22,9,5,.42)}.splash-loading-card>span{margin-top:7px;color:rgba(255,242,219,.76);font-size:9px;font-variant-numeric:tabular-nums;letter-spacing:.12em}.splash-progress-track{overflow:hidden;width:100%;height:5px;margin-top:11px;border:1px solid rgba(255,237,207,.22);border-radius:999px;background:rgba(38,19,13,.48);box-shadow:inset 0 1px 3px rgba(25,10,6,.28)}.splash-progress-track i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#b85f69,#d59c58 72%,#f0c987);box-shadow:0 0 8px rgba(227,161,104,.34)}
    </style>
  </head>
  <body>
    <div id="root"><main class="splash-screen" role="status" aria-live="polite" aria-label="Открываем ателье, загружено 0%"><div class="splash-loading-card"><strong>Открываем ателье…</strong><div class="splash-progress-track" role="progressbar" aria-label="Загрузка игры" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div><span>0%</span></div></main></div>
    <script type="module" src="./main.tsx"></script>
  </body>
